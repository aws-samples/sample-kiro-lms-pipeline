<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-label="Completion flow: visit each page, satisfy dwell and knowledge checks, reach the final page, course auto-completes with score 100">
  <style>
    .box { fill: #f5f7fa; stroke: #43506c; stroke-width: 2; }
    .done { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .label { font: 600 15px system-ui, sans-serif; fill: #1f2937; }
    .sub { font: 12px system-ui, sans-serif; fill: #4b5563; }
    .arrow { stroke: #43506c; stroke-width: 2; marker-end: url(#cfHead); }
  </style>
  <defs>
    <marker id="cfHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#43506c"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="50" width="155" height="70" rx="8"/>
  <text class="label" x="87" y="80" text-anchor="middle">Visit a page</text>
  <text class="sub" x="87" y="100" text-anchor="middle">sidebar or Next</text>
  <line class="arrow" x1="165" y1="85" x2="200" y2="85"/>
  <rect class="box" x="205" y="50" width="155" height="70" rx="8"/>
  <text class="label" x="282" y="75" text-anchor="middle">Satisfy gates</text>
  <text class="sub" x="282" y="95" text-anchor="middle">dwell elapsed +</text>
  <text class="sub" x="282" y="110" text-anchor="middle">checks correct</text>
  <line class="arrow" x1="360" y1="85" x2="395" y2="85"/>
  <rect class="box" x="400" y="50" width="155" height="70" rx="8"/>
  <text class="label" x="477" y="75" text-anchor="middle">Final page,</text>
  <text class="label" x="477" y="93" text-anchor="middle">all visited</text>
  <line class="arrow" x1="555" y1="85" x2="590" y2="85"/>
  <rect class="done" x="595" y="50" width="115" height="70" rx="8"/>
  <text class="label" x="652" y="80" text-anchor="middle">Complete</text>
  <text class="sub" x="652" y="100" text-anchor="middle">score 100</text>
</svg>
