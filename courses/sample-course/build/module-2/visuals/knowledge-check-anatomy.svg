<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Anatomy of a knowledge check: a question, three clickable options, and per-option feedback revealed on click">
  <style>
    .box { fill: #f5f7fa; stroke: #43506c; stroke-width: 2; }
    .option { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .correct { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .label { font: 600 16px system-ui, sans-serif; fill: #1f2937; }
    .sub { font: 13px system-ui, sans-serif; fill: #4b5563; }
    .tag { font: 600 12px system-ui, sans-serif; fill: #43506c; }
    .arrow { stroke: #43506c; stroke-width: 2; marker-end: url(#kcHead); }
  </style>
  <defs>
    <marker id="kcHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#43506c"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="10" width="440" height="240" rx="10"/>
  <text class="label" x="30" y="42">Which port does HTTPS use?</text>
  <text class="tag" x="30" y="62">question</text>
  <rect class="option" x="30" y="78" width="400" height="38" rx="6"/>
  <text class="sub" x="48" y="102">A. Port 80</text>
  <rect class="correct" x="30" y="126" width="400" height="38" rx="6"/>
  <text class="sub" x="48" y="150">B. Port 443</text>
  <rect class="option" x="30" y="174" width="400" height="38" rx="6"/>
  <text class="sub" x="48" y="198">C. Port 22</text>
  <text class="tag" x="30" y="236">options (each carries correct: true/false)</text>
  <line class="arrow" x1="450" y1="145" x2="500" y2="145"/>
  <rect class="box" x="505" y="105" width="205" height="80" rx="10"/>
  <text class="label" x="607" y="135" text-anchor="middle">feedback</text>
  <text class="sub" x="607" y="158" text-anchor="middle">shown per option,</text>
  <text class="sub" x="607" y="175" text-anchor="middle">revealed on click</text>
</svg>
